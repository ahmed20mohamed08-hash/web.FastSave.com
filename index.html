<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Save Pro - تحميل وتحويل الفيديوهات</title>
    <!-- استدعاء الأيقونات والخطوط -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #080d1a;
            --card-bg: rgba(15, 23, 42, 0.75);
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-purple: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(0, 240, 255, 0.2);
            --input-bg: rgba(6, 11, 25, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 0, 127, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* الكارت الرئيسي بتصميم زجاجي */
        .main-card {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--border-glow);
            box-shadow: 
                0 0 30px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(0, 240, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple), var(--neon-blue));
        }

        /* الهيدر واللوجو */
        .brand {
            text-align: center;
            padding: 35px 20px 20px;
        }

        .brand-logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.3));
        }

        .brand p {
            color: var(--text-sub);
            font-size: 14px;
            margin-top: 6px;
            font-weight: 400;
        }

        /* أزرار التنقل (Tabs) */
        .nav-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px;
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: var(--text-sub);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.2), rgba(0, 240, 255, 0.2));
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        /* محتوى التبويبات */
        .tab-content {
            padding: 30px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 600;
        }

        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        /* الأزرار النيون المتوهجة */
        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .btn-neon-blue {
            background: linear-gradient(135deg, #0072ff, var(--neon-blue));
            color: #000;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .btn-neon-blue:hover {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
            transform: translateY(-2px);
        }

        .btn-neon-pink {
            background: linear-gradient(135deg, var(--neon-pink), #ff5252);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
        }

        .btn-neon-pink:hover {
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.7);
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }

        /* صندوق الرسائل والحالة */
        .status-box {
            margin-top: 15px;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            display: none;
            background: rgba(6, 11, 25, 0.9);
            border: 1px solid var(--border-glow);
            font-weight: 600;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: var(--text-sub);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.2);
        }

        .dev-info {
            text-align: center;
            line-height: 2;
            color: var(--text-sub);
        }

        .dev-info h3 {
            color: var(--neon-blue);
            margin-bottom: 12px;
            font-size: 20px;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- الهيدر واللوجو -->
        <div class="brand">
            <div class="brand-logo"><i class="fas fa-bolt"></i> Fast Save Pro</div>
            <p>تحميل وتحويل الفيديوهات بسرعة فائقة وبدون إعلانات</p>
        </div>

        <!-- أزرار التنقل بين الأقسام -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('main')"><i class="fas fa-home"></i> الرئيسية</button>
            <button class="tab-btn" onclick="switchTab('convert')"><i class="fas fa-music"></i> تحويل محلي</button>
            <button class="tab-btn" onclick="switchTab('dev')"><i class="fas fa-code"></i> المطور</button>
        </div>

        <!-- 1. قسم الرئيسية (التحميل من الإنترنت) -->
        <div id="tab-main" class="tab-content active">
            <div class="input-group">
                <label>رابط الفيديو (يوتيوب، تيك توك، فيسبوك، أو أي منصة):</label>
                <input type="text" id="urlInput" placeholder="https://www.example.com/video...">
            </div>

            <button class="action-btn btn-neon-blue" id="checkBtn" onclick="checkLink()">
                <i class="fas fa-search"></i> فحص الرابط
            </button>

            <div class="input-group" style="margin-top: 20px;">
                <label>اختر الجودة أو الصيغة (بعد الفحص):</label>
                <select id="formatSelect" disabled>
                    <option>قم بفحص الرابط أولاً...</option>
                </select>
            </div>

            <button class="action-btn btn-neon-pink" id="downloadBtn" onclick="startDownload()" disabled>
                <i class="fas fa-download"></i> بدء التحميل الآن
            </button>

            <div id="statusMain" class="status-box"></div>
        </div>

        <!-- 2. قسم التحويل المحلي -->
        <div id="tab-convert" class="tab-content">
            <div class="input-group">
                <label>اختر فيديو من جهازك لتحويله إلى MP3:</label>
                <input type="file" id="localVideo" accept="video/*">
            </div>
            <button class="action-btn btn-neon-pink" onclick="convertLocalFile()">
                <i class="fas fa-sync"></i> تحويل إلى MP3 الآن
            </button>
            <div id="statusConvert" class="status-box"></div>
        </div>

        <!-- 3. قسم المطور -->
        <div id="tab-dev" class="tab-content">
            <div class="dev-info">
                <h3><i class="fas fa-shield-halved"></i> Fast Save System</h3>
                <p>منصة سريعة ومصممة بأحدث التقنيات لخدمتك.</p>
                <p>السيرفر النشط: <span style="color: var(--neon-pink);">Wispbyte Dedicated</span></p>
            </div>
        </div>

        <!-- الفوتر -->
        <div class="footer">
            Fast Save &copy; 2026 - جميع الحقوق محفوظة
        </div>
    </div>

    <!-- السكربت البرمجي المربوط بسيرفر Wispbyte -->
    <script>
        const API_BASE_URL = 'https://Fast-Save-Pro.wispbyte.app';

        // التنقل بين الأقسام
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'main') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-main').classList.add('active');
            } else if (tabName === 'convert') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-convert').classList.add('active');
            } else if (tabName === 'dev') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('tab-dev').classList.add('active');
            }
        }

        // فحص الرابط
        async function checkLink() {
            const urlInput = document.getElementById('urlInput');
            const checkBtn = document.getElementById('checkBtn');
            const statusBox = document.getElementById('statusMain');
            const formatSelect = document.getElementById('formatSelect');
            const downloadBtn = document.getElementById('downloadBtn');

            const url = urlInput ? urlInput.value.trim() : '';
            if (!url) {
                alert('الرجاء إدخال رابط الفيديو أولاً!');
                return;
            }

            checkBtn.disabled = true;
            checkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الفحص...';
            statusBox.style.display = 'block';
            statusBox.style.color = 'var(--neon-blue)';
            statusBox.textContent = 'جاري الاتصال بالسيرفر وفحص الرابط...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();
                if (!response.ok || data.error) throw new Error(data.error || 'تعذر فحص الرابط');

                formatSelect.innerHTML = '';
                data.formats.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.id;
                    opt.textContent = f.label;
                    formatSelect.appendChild(opt);
                });

                formatSelect.disabled = false;
                downloadBtn.disabled = false;
                statusBox.style.color = '#22c55e';
                statusBox.textContent = `✅ تم التعرف على الفيديو: ${data.title}`;

            } catch (err) {
                statusBox.style.color = '#ef4444';
                statusBox.textContent = err.message || 'فشل الاتصال بالسيرفر';
            } finally {
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-search"></i> فحص الرابط';
            }
        }

        // بدء التنزيل الفوري لجهاز المستخدم
        function startDownload() {
            const urlInput = document.getElementById('urlInput');
            const formatSelect = document.getElementById('formatSelect');

            const url = urlInput ? urlInput.value.trim() : '';
            const format = formatSelect ? formatSelect.value : 'best';

            if (!url) return;

            const downloadUrl = `${API_BASE_URL}/api/download?url=${encodeURIComponent(url)}&format=${encodeURIComponent(format)}`;
            window.location.href = downloadUrl;
        }

        // تحويل فيديو محلي
        async function convertLocalFile() {
            const fileInput = document.getElementById('localVideo');
            const statusBox = document.getElementById('statusConvert');

            if (!fileInput.files || fileInput.files.length === 0) {
                alert('اختر ملف فيديو أولاً');
                return;
            }

            const formData = new FormData();
            formData.append('video', fileInput.files[0]);

            statusBox.style.display = 'block';
            statusBox.style.color = 'var(--neon-blue)';
            statusBox.textContent = 'جاري تحويل الملف إلى MP3...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/convert`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('فشل التحويل');

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'converted_audio.mp3';
                document.body.appendChild(a);
                a.click();
                a.remove();

                statusBox.style.color = '#22c55e';
                statusBox.textContent = '✅ تم التحويل بنجاح وبدأ التحميل على جهازك!';

            } catch (err) {
                statusBox.style.color = '#ef4444';
                statusBox.textContent = err.message || 'حدث خطأ أثناء تحويل الملف';
            }
        }
    </script>
</body>
</html>
