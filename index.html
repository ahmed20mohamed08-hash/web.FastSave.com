<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Save - تحميل وتعديل الفيديوهات</title>
    <!-- استدعاء خطوط وأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            padding: 30px;
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: #16a34a;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-download"></i> Fast Save Pro</h1>
            <p>تحميل فيديوهات الإنترنت بسهولة فائقة</p>
        </div>

        <!-- إدخال الرابط -->
        <div class="form-group">
            <label for="urlInput">رابط الفيديو (يوتيوب، تيك توك، إلخ):</label>
            <input type="text" id="urlInput" placeholder="https://www.example.com/video...">
        </div>

        <!-- زر الفحص -->
        <button type="button" class="btn btn-primary" id="checkBtn" onclick="checkLink()">
            <i class="fas fa-search"></i> فحص الرابط
        </button>

        <!-- اختيار الجودة -->
        <div class="form-group" style="margin-top: 20px;">
            <label for="formatSelect">اختر الجودة:</label>
            <select id="formatSelect" disabled>
                <option value="best">قم بفحص الرابط أولاً...</option>
            </select>
        </div>

        <!-- زر التحميل -->
        <button type="button" class="btn btn-success" id="downloadBtn" onclick="startDownload()" disabled>
            <i class="fas fa-cloud-download-alt"></i> بدء التحميل الآن
        </button>

        <!-- شاشة الحالة -->
        <div id="downloadStatus" class="status-message"></div>

        <div class="footer">
            Fast Save &copy; 2026 - جميع الحقوق محفوظة
        </div>
    </div>

    <!-- سكود الاتصال بالسيرفر -->
    <script>
        // رابط سيرفر Wispbyte الخاص بك (تأكد أنه يبدأ بـ https)
        const API_BASE_URL = 'https://Fast-Save-Pro.wispbyte.app';

        async function checkLink() {
            const urlInput = document.getElementById('urlInput');
            const checkBtn = document.getElementById('checkBtn');
            const statusDiv = document.getElementById('downloadStatus');
            const formatSelect = document.getElementById('formatSelect');
            const downloadBtn = document.getElementById('downloadBtn');

            const url = urlInput ? urlInput.value.trim() : '';

            if (!url) {
                alert('الرجاء إدخال الرابط أولاً!');
                return;
            }

            checkBtn.disabled = true;
            checkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الفحص...';
            
            statusDiv.style.display = 'block';
            statusDiv.style.backgroundColor = '#1e293b';
            statusDiv.style.color = '#38bdf8';
            statusDiv.textContent = 'جاري الاتصال بالسيرفر لفحص الرابط...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/check`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || 'تعذر فحص الرابط');
                }

                // تعبئة الخيارات
                formatSelect.innerHTML = '';
                if (data.formats && data.formats.length > 0) {
                    data.formats.forEach(f => {
                        const opt = document.createElement('option');
                        opt.value = f.id;
                        opt.textContent = f.label;
                        formatSelect.appendChild(opt);
                    });
                }

                formatSelect.disabled = false;
                downloadBtn.disabled = false;

                statusDiv.style.backgroundColor = 'rgba(34, 197, 94, 0.1)';
                statusDiv.style.color = 'var(--success)';
                statusDiv.textContent = `✅ تم بنجاح: ${data.title}`;

            } catch (err) {
                console.error(err);
                statusDiv.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
                statusDiv.style.color = 'var(--error)';
                statusDiv.textContent = err.message || 'فشل الاتصال بالسيرفر، تأكد من تشغيله.';
            } finally {
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-search"></i> فحص الرابط';
            }
        }

        function startDownload() {
            const urlInput = document.getElementById('urlInput');
            const formatSelect = document.getElementById('formatSelect');
            
            const url = urlInput ? urlInput.value.trim() : '';
            const format = formatSelect ? formatSelect.value : 'best';

            if (!url) return;

            // توجيه المتصفح لتنزيل الملف مباشرة من سيرفر Wispbyte
            const downloadUrl = `${API_BASE_URL}/api/download?url=${encodeURIComponent(url)}&format=${encodeURIComponent(format)}`;
            window.location.href = downloadUrl;
        }
    </script>
</body>
</html>
